name: Discover restaurant image sources (Batch 2)
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/batch2-discover-photo-links.mjs'
      - '.github/workflows/batch2-photo-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch and describe possible official image matches
        run: node research/batch2-discover-photo-links.mjs
