name: Batch 4 source menu image discovery
on:
  pull_request:
    paths:
      - 'research/batch4-source-discovery.mjs'
      - '.github/workflows/batch4-source-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node research/batch4-source-discovery.mjs
