name: Verify Batch 2 food photographs
on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/src/verified-dish-photos.js'
      - 'mobile/scripts/verify-batch2-photo-urls.mjs'
      - '.github/workflows/verify-batch2-photos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci --prefix mobile
      - name: Validate sourced photos (external URLs may block server fetches)
        run: node mobile/scripts/verify-batch2-photo-urls.mjs
