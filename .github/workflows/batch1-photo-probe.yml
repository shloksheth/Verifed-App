name: Photo source research for Pizza Bruno and WPBC
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/batch1-photo-probe.mjs'
      - '.github/workflows/batch1-photo-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node research/batch1-photo-probe.mjs
