name: Verify Pizza Bruno and WPBC photo URLs
on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/src/verified-dish-photos.js'
      - 'mobile/scripts/verify-batch1-rest-photos.mjs'
      - '.github/workflows/verify-batch1-rest-photos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --prefix mobile
      - run: node mobile/scripts/verify-batch1-rest-photos.mjs
