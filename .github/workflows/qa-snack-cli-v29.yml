name: Capture V29 Expo Snack page in headless Chrome

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/qa-snack-cli-v29.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Capture actual Expo Snack page pixels
        shell: bash
        run: |
          set +e
          mkdir -p research/qa/v29/captures
          URL="https://snack.expo.dev/embedded/3VrwugCB__8sCwQhRftI9?platform=web&preview=true&theme=light"
          timeout 58s google-chrome --headless --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --disable-background-networking --window-size=1500,1000 \
            --hide-scrollbars --virtual-time-budget=24000 \
            --screenshot="$(pwd)/research/qa/v29/captures/headless-chrome-snack.png" "$URL" \
            >research/qa/v29/captures/chrome-output.txt 2>&1
          CODE=$?
          printf '%s\n' "Exit code: $CODE" >> research/qa/v29/captures/chrome-output.txt
          ls -lh research/qa/v29/captures/headless-chrome-snack.png || true
          exit 0
      - name: Save screenshot if captured
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/qa/v29/captures/headless-chrome-snack.png 2>/dev/null || true
          git add research/qa/v29/captures/chrome-output.txt
          git diff --cached --quiet || git commit -m 'Record headless Chrome preview of Expo Snack V29'
          git push origin HEAD:main
